intro:
  en: 'More than five years administering Microsoft Entra ID, Active Directory and Microsoft 365 for organizations of up to 2,500 users — Conditional Access, MFA, SSO and Zero Trust access, designed with Information Security. Lately the perimeter too: OPNsense, Wazuh, Zabbix and VMware, held together with Python and PowerShell.'
  es: 'Más de cinco años administrando Microsoft Entra ID, Active Directory y Microsoft 365 en organizaciones de hasta 2.500 usuarios: Conditional Access, MFA, SSO y acceso Zero Trust, diseñados junto a Seguridad de la Información. Últimamente, también el perímetro: OPNsense, Wazuh, Zabbix y VMware, unidos con Python y PowerShell.'
