about:
  en:
  - 'I work where people meet systems: deciding who gets access to what, under which conditions, and being able to prove it later in an audit. Most of that work has lived inside Microsoft Entra ID, Active Directory and Microsoft 365, for organizations of up to 2,500 users.'
  - The other half is keeping the ground under that identity layer steady — firewalls, VPNs, directories, hypervisors and monitoring — and leaving behind documentation the next engineer can actually follow.
  - I am preparing the Microsoft SC-300 certification to formalize that focus on identity security.
  es:
  - 'Trabajo donde las personas se encuentran con los sistemas: decidir quién accede a qué, bajo qué condiciones, y poder demostrarlo después en una auditoría. Casi todo ese trabajo ha ocurrido dentro de Microsoft Entra ID, Active Directory y Microsoft 365, en organizaciones de hasta 2.500 usuarios.'
  - La otra mitad consiste en mantener firme el terreno bajo esa capa de identidad —firewalls, VPN, directorios, hipervisores y monitoreo— y dejar documentación que el siguiente ingeniero pueda seguir de verdad.
  - Me estoy preparando para la certificación Microsoft SC-300, para formalizar este enfoque en seguridad de identidades.
